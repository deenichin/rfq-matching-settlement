# Virtual workspace. Four members, in the dependency order of PLAN.md's workspace
# sketch: core -> chain -> runtime -> scenarios.
#
# Package names carry an `rfq-` prefix because a package named `core` would be passed
# to rustc as `--extern core`, shadowing the sysroot `core` crate inside every unit that
# depends on it. Directory names match PLAN.md; only the package names are prefixed.
[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/chain",
    "crates/runtime",
    "crates/scenarios",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
rfq-core = { path = "crates/core" }
rfq-chain = { path = "crates/chain" }
rfq-runtime = { path = "crates/runtime" }
# The only dev-dependency permitted anywhere in the workspace (CLAUDE 36).
proptest = "1"

# Lints encode the CLAUDE.md rules that a compiler can check. The rules a compiler
# cannot check are enforced by review and by the tests each stage gate names.
[workspace.lints.rust]
# Rule 25.
unsafe_code = "forbid"
# The prose is the deliverable; every public item states what it is for.
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Rule 13 — no floats anywhere, including tests.
float_arithmetic = "deny"
float_cmp = "deny"
# Rule 14 — every arithmetic operation is checked; `+` on the money path is a bug.
arithmetic_side_effects = "deny"
# Rule 23 — no unwrap/expect outside tests and main startup, where they are re-allowed
# by a scoped `allow` that names why.
unwrap_used = "deny"
expect_used = "deny"
# Rule 35 — a named absence in the write-up beats a half-built feature in the code.
todo = "deny"
unimplemented = "deny"
# Rule 8 — no I/O in the engine. The scenario runner re-allows this at its crate root,
# which is the only place in the workspace that prints.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# Noise, not signal, for a workspace whose module names are the domain vocabulary.
module_name_repetitions = "allow"
must_use_candidate = "allow"
